name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: fosicons.com
      - name: Read pinned library revision
        id: lock
        run: echo "rev=$(jq -r .revision fosicons.com/src/data/source-lock.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: fos-icons/fos-icons
          ref: ${{ steps.lock.outputs.rev }}
          path: fos-icons
      # pnpm's version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: fosicons.com/package.json
      - uses: actions/setup-node@v4
        with:
          node-version-file: fosicons.com/.nvmrc
          cache: pnpm
          cache-dependency-path: fosicons.com/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: fosicons.com
      - run: pnpm run check
        working-directory: fosicons.com
